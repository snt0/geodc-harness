name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-skills:
    name: Agent skills
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check the .claude/skills mirror
        shell: pwsh
        run: ./dev/sync-agent-skills.ps1

      - name: Check the hook and bootstrap scripts parse
        run: |
          for f in .claude/hooks/*.sh bootstrap.sh dev/*.sh; do bash -n "$f"; done
          jq empty .claude/settings.json
